<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorgana</title>
    <link rel="stylesheet" href="gorgana_styles.css">
</head>
<body>

    <div class="page-container">

        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-logo">❋</div>

            <div class="nav-links">
                <a href="#">Collections</a>
                <a href="#">Clothing</a>
                <a href="#">Accessories</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Hero -->
            <section class="hero">
                <div class="brand">
                    <span>Gorgana</span>
                    <span class="brand-icon">❋</span>
                </div>

                <p class="tagline">
                    Handmade clothing & accessories
                </p>
            </section>

            <!-- Call to Action -->
            <a href="#collections" class="cta-button">
                Let’s Wear More Art!
            </a>

            <!-- Disclaimer -->
            <div class="disclaimer">
                * Every item is one-of-a-kind, uniquely hand-made and
                may have slight variances from the pictures shown.
            </div>

            <!-- Collections -->
            <section class="collections" id="collections">
                <h2>Shop the Collection</h2>

                <div class="collection-items">
                    <a href="#" class="collection-card"></a>
                    <a href="#" class="collection-card"></a>
                    <a href="#" class="collection-card"></a>
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <small>Copyright</small>
        </footer>

    </div>

</body>
</html>
