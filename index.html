<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gorgana | Handmade Clothing & Accessories</title>

    <link rel="icon" type="image/png" href="gorgona_favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-container">

        <!-- Navigation -->
        <nav class="navbar">

            <a href="#" class="nav-logo">
                <img src="gorgana_logo.png" alt="Gorgana">
            </a>

            <div class="nav-links">
                <a href="#collections">Collections</a>
                <a href="#clothing">Clothing</a>
                <a href="#accessories">Accessories</a>
            </div>

        </nav>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Hero -->
            <section class="hero">

                <img
                    src="gorgana_logo.png"
                    alt="Gorgana"
                    class="hero-logo"
                >

                <p class="tagline">
                    Handmade clothing & accessories
                </p>

            </section>


            <!-- Call to Action -->
            <a href="#collections" class="cta-button">
                Let's Wear More Art!
            </a>


            <!-- Disclaimer -->
            <div class="disclaimer">
                * Every item is one-of-a-kind, uniquely hand-made and
                may have slight variances from the pictures shown.
            </div>


            <!-- Collections -->
            <section class="collections" id="collections">

                <h2>Shop the Collection</h2>

                <div class="collection-items">

                    <a href="#clothing" class="collection-card">
                        <span>Clothing</span>
                    </a>

                    <a href="#accessories" class="collection-card">
                        <span>Accessories</span>
                    </a>

                    <a href="#" class="collection-card">
                        <span>All Items</span>
                    </a>

                </div>

            </section>

        </main>


        <!-- Footer -->
        <footer class="footer">
            <small>Copyright &copy; Gorgana</small>
        </footer>

    </div>

</body>
</html>
